# release.yml — push the depool images for the app store to ghcr.io,
# MULTI-ARCH (linux/amd64 + linux/arm64 — most Umbrels are Raspberry Pis).
# Manual: Actions → release → Run workflow (input: version, e.g. v0.2.0).
#
# Why CI and not the dev box: the dev box's fine-grained PAT cannot write
# packages; this workflow's GITHUB_TOKEN gets packages:write for free.
# Every input is a PUBLIC artifact the tenant already serves (the bundle
# install.sh uses) — no platform checkout, no secrets, and since v0.2.0 no
# images.tar.gz either: everything builds FROM SOURCE under buildx, so both
# architectures come from the same Dockerfiles.
#
# Image set (v0.2.0, mainnet-first — the app's compose is the contract):
#   depool-cln          CLN + env-driven bitcoin-cli wrapper (multi-arch bases)
#   depool-bootstrap    regtest-only one-shot (dev overlay; not in the app)
#   depool-sharechaind  node:20-slim + baked modules tree
#   depool-control      alpine + docker-cli/compose + baked app compose
#   depool-stratum      node:20-slim (bundle Dockerfile)
#   depool-relay        strfry 1.1.1 source build (arm64 under qemu)
# The chain node itself is upstream bitcoin/bitcoin:29 — multi-arch already,
# referenced directly by the app compose, nothing for us to build.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'image version tag, e.g. v0.2.0'
        required: true
permissions:
  contents: write
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.version }}
      GH: ghcr.io/lstgms9
      ORIGIN: https://hashoid.io
      IMAGES: depool-cln depool-bootstrap depool-sharechaind depool-control depool-stratum depool-relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # arm64 emulation for the source builds
      - uses: docker/setup-buildx-action@v3

      # ── the reduced modules tree + stack sources, from the same bundle ──
      - name: Fetch the tenant bundle
        run: |
          curl -fsSL "$ORIGIN/api/btc/stack/bundle" -o bundle.tgz
          mkdir bundle && tar -xzf bundle.tgz -C bundle stack modules
          cp depool-node/docker-compose.yml bundle/docker-compose.yml
          cp release/control.env bundle/control.env
          ls bundle/modules/mod-btc/lib bundle/modules/mod-chat/lib
          # strfry's source build pins -j2; under qemu any parallelism helps
          sed -i 's/make -j2/make -j$(nproc)/' bundle/stack/relay/Dockerfile

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ── build both architectures FROM SOURCE, push as one manifest list ──
      - name: Build + push the six images (amd64 + arm64)
        run: |
          set -e
          bx() { docker buildx build --platform linux/amd64,linux/arm64 --push "$@"; }
          bx -f release/Dockerfile.cln-umbrel        -t $GH/depool-cln:$VER        bundle
          bx -f release/Dockerfile.bootstrap-umbrel  -t $GH/depool-bootstrap:$VER  bundle
          bx -f release/Dockerfile.sharechaind-umbrel -t $GH/depool-sharechaind:$VER bundle
          bx -f release/Dockerfile.control-umbrel    -t $GH/depool-control:$VER    bundle
          # ⚠ stratum's source moved with the stack consolidation (v0.2.2,
          # 2026-09-13): it lives in the modules tree now, like sharechaind.
          # The old bundle/stack/stratum path stopped existing and took the
          # whole release down with it.
          bx -f bundle/modules/mod-depool/stack/stratum/Dockerfile -t $GH/depool-stratum:$VER bundle/modules/mod-depool/stack/stratum
          bx -f bundle/stack/relay/Dockerfile        -t $GH/depool-relay:$VER      bundle/stack/relay

      # ── the version pins in the app compose must match what we just pushed ──
      - name: Pin the compose + lock
        run: |
          set -e
          for img in $IMAGES; do
            sed -i "s#ghcr.io/lstgms9/$img:v[0-9.]*#ghcr.io/lstgms9/$img:$VER#g" depool-node/docker-compose.yml
          done
          node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const names = process.env.IMAGES.split(" ");
            const ver = process.env.VER, gh = process.env.GH;
            const lock = {};
            for (const n of names) {
              // the MANIFEST LIST digest — what an arm64 pull resolves through
              const d = execSync(`docker buildx imagetools inspect ${gh}/${n}:${ver}`)
                .toString().match(/Digest:\s*(sha256:[0-9a-f]+)/)[1];
              lock[n] = { tag: ver, digest: d };
            }
            fs.writeFileSync("release/images-lock.json", JSON.stringify(lock, null, 1) + "\n");
          '
          git config user.name "depublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add depool-node/docker-compose.yml release/images-lock.json
          git commit -m "[release] $VER images pushed + pinned (amd64+arm64)" || echo "nothing to commit"
          git push

      - name: Summary
        run: |
          for img in $IMAGES; do
            echo "$GH/$img:$VER pushed (linux/amd64 + linux/arm64)" >> $GITHUB_STEP_SUMMARY
          done
          echo "arm64 strfry builds under qemu — this step is the slow one" >> $GITHUB_STEP_SUMMARY
