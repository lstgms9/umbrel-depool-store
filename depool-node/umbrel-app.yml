manifestVersion: 1
id: depool-node
category: bitcoin
name: Depool Node
version: 0.2.2
tagline: Mine with your own node — no pool in the middle
description: >-
  Mine Bitcoin with your own node, no pool in the middle. This app runs a
  Stratum endpoint for your ASIC, the depool sharechain daemon, a local
  share relay, and the Lightning wallet your payouts land in.


  IT USES YOUR BITCOIN NODE. This app has no chain of its own: it requires
  the Bitcoin Node app and reads templates from it (getblocktemplate), so
  there is no second copy of the blockchain and nothing to sync twice. If
  your node is pruned that is fine — mining only needs the tip.


  SET-UP: install Bitcoin Node first (Umbrel asks you to), open this app and
  point your ASIC's pool URL at this box's LAN address on port 3333 — the
  app's own page shows the exact address and the live status. Then claim the
  box on the Mine page at hashoid.io. Your shares are signed by this node;
  payouts settle over Lightning to your own wallet.
releaseNotes: >-
  Mainnet: the node now mines real Bitcoin and settles real-sats Lightning
  payouts. Full validation on a pruned chain, multi-arch images (arm64
  Raspberry Pis included), and one Bitcoin chain for both mining templates
  and Lightning.
