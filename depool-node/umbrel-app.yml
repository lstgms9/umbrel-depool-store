manifestVersion: 1
id: depool-node
category: bitcoin
name: Depool Node
version: 0.2.1
tagline: Mine with your own node — no pool in the middle
description: >-
  Run a sovereign mining node on your Umbrel: a full-validating pruned
  Bitcoin node, a Stratum endpoint for your ASIC, the depool sharechain
  daemon, and a Lightning wallet for payouts.


  Your ASIC's jobs come from YOUR node — you build your own block templates
  instead of pooling away that choice. Install, point the ASIC at this box's
  LAN address on port 3333, and claim your box on hashoid.io (Mine page) —
  the same pairing flow as a bare-metal install. The box phones home by
  itself; payouts settle over Lightning to your own wallet.


  Storage: the node keeps a pruned copy of the Bitcoin chain (about 10GB)
  under the app's data dir, so uninstall and backup behave like any Umbrel
  app. The first sync takes a few days — full validation, no shortcuts.
releaseNotes: >-
  Mainnet: the node now mines real Bitcoin and settles real-sats Lightning
  payouts. Full validation on a pruned chain, multi-arch images (arm64
  Raspberry Pis included), and one Bitcoin chain for both mining templates
  and Lightning.
