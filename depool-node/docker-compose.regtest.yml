# docker-compose.regtest.yml — the TEST overlay for the app compose. Never
# shipped: umbrelOS runs depool-node/docker-compose.yml alone; this file
# exists so the dev harness (tests/harness.sh) can prove the wrap's MECHANICS
# — GBT templates, share validation, the funded payer→payee channel, BOLT12
# payouts — on a chain that actually produces blocks.
#
#   docker compose -f depool-node/docker-compose.yml \
#                  -f depool-node/docker-compose.regtest.yml up
#
# ONE chain, exactly like the app: the SAME stock bitcoind image drops to
# -regtest, and mining templates AND Lightning settlement ride it — the
# mainnet shape, just with cheap blocks. The old blake2b fork overlay is gone
# with the fork itself: stock CLN cannot parse fork v2 blocks ("bad block"),
# and the app has no fork to test. Mainnet values in the app file are
# overridden, never edited.
services:
  bitcoind:
    command: >
      -regtest -server -printtoconsole
      -rpcuser=depool -rpcpassword=depool -rpcport=18443
      -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0
      -fallbackfee=0.0002

  cln-payer:
    command: >
      --network=regtest --lightning-dir=/root/.lightning-payer
      --bitcoin-datadir=/home/bitcoin/.bitcoin
      --bitcoin-cli=/usr/local/bin/bitcoin-cli
      --bitcoin-rpcuser=depool --bitcoin-rpcpassword=depool
      --bitcoin-rpcconnect=bitcoind --bitcoin-rpcport=18443
      --addr=0.0.0.0:9735 --disable-plugin=cln-grpc --log-level=info
      --developer --dev-bitcoind-poll=1
    environment:
      BCLI_CONNECT: bitcoind
      BCLI_PORT: "18443"

  cln-payee:
    command: >
      --network=regtest --lightning-dir=/root/.lightning-payee
      --bitcoin-datadir=/home/bitcoin/.bitcoin
      --bitcoin-cli=/usr/local/bin/bitcoin-cli
      --bitcoin-rpcuser=depool --bitcoin-rpcpassword=depool
      --bitcoin-rpcconnect=bitcoind --bitcoin-rpcport=18443
      --addr=0.0.0.0:9735 --disable-plugin=cln-grpc --log-level=info
      --developer --dev-bitcoind-poll=1
    environment:
      BCLI_CONNECT: bitcoind
      BCLI_PORT: "18443"

  # the one-shot: fund the payer, open payer→payee (the app has no such
  # service — mainnet onboarding is the user depositing real sats)
  bootstrap:
    image: ghcr.io/lstgms9/depool-bootstrap:v0.2.2
    entrypoint: ["/bin/sh", "/mod-btc/stack/bootstrap.sh"]
    environment:
      BOOTSTRAP_BCLI_ARGS: "-rpcconnect=bitcoind -rpcport=18443 -rpcuser=depool -rpcpassword=depool"
    volumes:
      - ${APP_DATA_DIR}/data/cln-payer:/root/.lightning-payer
      - ${APP_DATA_DIR}/data/cln-payee:/root/.lightning-payee
    depends_on: [bitcoind, cln-payer, cln-payee]
    restart: "no"

  sharechaind:
    environment:
      # local relay + a throwaway network tag: regtest shares must never
      # touch the pool relay or the live "bitcoin" cohort
      RELAYS: ws://relay:7777
      NETWORK: depool-umbrel-regtest
      CHAIN_RPC: http://bitcoind:18443
      CLN_RPC: /run/cln/regtest/lightning-rpc
      CLN_PAYEE_RPC: /run/cln-payee/regtest/lightning-rpc

  control:
    environment:
      # regtest rails (the app file's mainnet values are overridden)
      BC_ARGS: -regtest -rpcuser=depool -rpcpassword=depool -rpcport=18443
      CLN_NET: regtest

  stratum:
    environment:
      CHAIN_RPC: http://bitcoind:18443
